<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BEZRA V1 | UNIVERSAL SCRIPT</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --void: #020406;
            --neon: #00ff88;
            --danger: #ff003c;
            --gold: #f3ba2f;
            --cell-top: #0d1218;
            --cell-side: #05080b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { 
            background-color: var(--void); color: #fff; font-family: 'Cairo', sans-serif; 
            overflow: hidden; height: 100vh; width: 100vw;
            display: flex; flex-direction: column;
        }

        .screen {
            position: fixed; inset: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; padding: 10px;
            background: radial-gradient(circle at center, #0a1118 0%, #020406 100%);
            overflow: hidden;
        }
        .active-screen { display: flex !important; }

        /* توب بار متناسق */
        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 15px; background: rgba(255,255,255,0.03); border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px;
            flex-shrink: 0;
        }

        /* --- APPLE AREA (RESPONSIVE 3D) --- */
        .apple-area { 
            flex-grow: 1; display: flex; gap: 8px; 
            padding: 5px; perspective: 1000px; overflow: hidden;
            justify-content: center; align-items: center;
        }
        
        .odds-sidebar { 
            width: 50px; display: grid; grid-template-rows: repeat(10, 1fr); gap: 5px; height: 95%;
        }
        .odd-tag {
            background: rgba(0,0,0,0.5); border: 1px solid rgba(243, 186, 47, 0.2);
            border-radius: 5px; display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron'; font-size: 8px; color: var(--gold);
        }
        .odd-tag.active { border-color: var(--gold); background: rgba(243, 186, 47, 0.2); box-shadow: 0 0 10px var(--gold); }

        .apple-grid { 
            width: 100%; max-width: 500px; height: 95%;
            display: grid; grid-template-rows: repeat(10, 1fr); gap: 5px;
            transform: rotateX(20deg) rotateY(-5deg); transform-style: preserve-3d;
        }
        .apple-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; transform-style: preserve-3d; }

        .cell {
            position: relative; background: var(--cell-top); border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.4s; transform-style: preserve-3d;
            box-shadow: 0 4px 0 var(--cell-side), 0 5px 15px rgba(0,0,0,0.5);
        }

        .cell i { font-size: 16px; color: transparent; transform: translateZ(10px); }

        .cell-win {
            background: #1a2a24 !important; border: 1px solid var(--neon);
            transform: translateZ(15px);
            box-shadow: 0 6px 0 #005a30, 0 10px 20px rgba(0, 255, 136, 0.4);
        }
        .cell-win i { color: var(--neon) !important; filter: drop-shadow(0 0 8px var(--neon)); }

        /* رادار الطيارة المتجاوب */
        .radar-screen {
            background: #000; border-radius: 50%; height: 60vw; width: 60vw; 
            max-height: 300px; max-width: 300px; margin: auto;
            border: 4px solid #111; position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 40px rgba(255, 0, 60, 0.2);
        }
        .radar-line {
            position: absolute; width: 50%; height: 2px; background: linear-gradient(to right, transparent, var(--danger));
            top: 50%; left: 50%; transform-origin: left; animation: radarRotate 2s linear infinite;
        }
        @keyframes radarRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        #crash-res { font-family: 'Orbitron'; font-size: 15vw; max-size: 80px; color: var(--danger); z-index: 10; text-shadow: 0 0 20px var(--danger); }

        /* الأزرار */
        .btn-action {
            width: 100%; padding: 15px; border-radius: 20px; border: none;
            font-family: 'Cairo'; font-weight: 900; font-size: 16px;
            background: var(--neon); color: #000; box-shadow: 0 5px 0 #005a30;
            margin-bottom: 5px; flex-shrink: 0; cursor: pointer;
        }

        /* شاشة الدخول */
        #scr-auth { justify-content: center; align-items: center; }
        .login-card { background: #080c11; padding: 30px; border-radius: 30px; border: 2px solid var(--neon); text-align: center; width: 90%; max-width: 350px; }
        .auth-input { width: 100%; padding: 15px; background: #000; border: 1px solid #1a222c; border-radius: 12px; color: var(--neon); text-align: center; margin-bottom: 15px; font-family: 'Orbitron'; }

        @media (min-width: 768px) {
            #crash-res { font-size: 80px; }
            .odd-tag { font-size: 12px; }
            .cell i { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div id="scr-auth" class="screen active-screen">
        <div class="login-card">
            <h1 style="font-family:'Orbitron';">BEZRA <span style="color:var(--neon)">V1</span></h1>
            <input type="text" id="user-id" class="auth-input" placeholder="ACCOUNT ID">
            <input type="text" id="access-code" class="auth-input" placeholder="ACCESS CODE">
            <button class="btn-action" onclick="validateLogin()">LOGIN SYSTEM</button>
            <a href="https://t.me/B_Y2Y" style="color:var(--gold); text-decoration:none; font-size:12px;">GET CODE</a>
        </div>
    </div>

    <div id="scr-hub" class="screen">
        <h1 style="text-align:center; font-family:'Orbitron'; margin: 20px 0;">BEZRA HUB</h1>
        <div style="max-width:400px; margin:auto; width:100%;">
            <div class="btn-action" onclick="navTo('apple')" style="height:100px; display:flex; justify-content:space-between; align-items:center; padding:0 30px;">
                <span>APPLE OF FORTUNE </span><i class="fas fa-apple-whole"></i>
            </div>
            <div class="btn-action" onclick="navTo('crash')" style="background:var(--danger); box-shadow:0 5px 0 #8b0000; color:#fff; height:100px; display:flex; justify-content:space-between; align-items:center; padding:0 30px;">
                <span>CRASH RADAR</span><i class="fas fa-plane-up"></i>
            </div>
        </div>
    </div>

    <div id="scr-apple" class="screen">
        <div class="top-nav">
            <button onclick="showScreen('scr-hub')" style="background:none; border:none; color:var(--danger); font-weight:900;">BACK</button>
            <span style="font-family:'Orbitron'; color:var(--neon); font-size:10px;">APPLE OF FORTUNE </span>
        </div>
        <div class="apple-area">
            <div id="apple-odds" class="odds-sidebar"></div>
            <div id="apple-grid" class="apple-grid"></div>
        </div>
        <button class="btn-action" id="btn-apple" onclick="runApple()">EXECUTE SCAN</button>
    </div>

    <div id="scr-crash" class="screen">
        <div class="top-nav">
            <button onclick="showScreen('scr-hub')" style="background:none; border:none; color:var(--danger); font-weight:900;">BACK</button>
            <span style="font-family:'Orbitron'; color:var(--danger); font-size:10px;">CRASH_RADAR</span>
        </div>
        <div class="radar-screen">
            <div class="radar-line"></div>
            <div id="crash-res">1.00x</div>
        </div>
        <button class="btn-action" style="background:var(--danger); color:#fff; box-shadow:0 5px 0 #8b0000; margin-top:20px;" onclick="runCrash()">START SCAN</button>
    </div>

    <script>
        const ODDS = ["349.68x", "69.93x", "27.97x", "11.18x", "6.71x", "4.82x", "2.41x", "1.93x", "1.54x", "1.23x"];
        
        function validateLogin() {
            const code = document.getElementById('access-code').value;
            if(code === localStorage.getItem('active_access_code')) { showScreen('scr-hub'); }
            else { alert("INVALID CODE"); }
        }

        function navTo(p) { showScreen('scr-'+p); if(p==='apple') buildApple(); }
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(id).classList.add('active-screen');
        }

        function buildApple() {
            const oDiv = document.getElementById('apple-odds');
            const gDiv = document.getElementById('apple-grid');
            oDiv.innerHTML = ''; gDiv.innerHTML = '';
            ODDS.forEach((o, i) => {
                oDiv.innerHTML += `<div class="odd-tag" id="ot-${i}">${o}</div>`;
                let r = `<div class="apple-row">`;
                for(let c=0; c<5; c++) r += `<div class="cell" id="ac-${i}-${c}"><i class="fas fa-apple-whole"></i></div>`;
                gDiv.innerHTML += r + `</div>`;
            });
        }

        async function runApple() {
            buildApple();
            const btn = document.getElementById('btn-apple');
            btn.innerText = "SCANNING...";
            for(let r=9; r>=0; r--) {
                await new Promise(res => setTimeout(res, 300));
                document.getElementById('ot-'+r).classList.add('active');
                document.getElementById(`ac-${r}-${Math.floor(Math.random()*5)}`).classList.add('cell-win');
            }
            btn.innerText = "EXECUTE SCAN";
        }

        function runCrash() {
            const res = document.getElementById('crash-res');
            res.innerText = "..";
            setTimeout(() => { res.innerText = (Math.random()*(4-1.1)+1.1).toFixed(2)+"x"; }, 1200);
        }
    </script>
</body>
</html>
